strategy: trend_follower_port
description: "helixa trend_follower \u79FB\u690D \u2014 Donchian20 + ADX \u95E8 +\
  \ Chandelier ATR\xD73 \u79FB\u52A8\u6B62\u635F + 30d \u65F6\u95F4\u6B62\u635F(SWAP,\u591A\
  \u7A7A)"
timeframe: 1D
instruments:
- BTC-USDT-SWAP
- ETH-USDT-SWAP
- SOL-USDT-SWAP
db_table: market_data.ohlcv_1h
# okx_swap = SWAP 4H bars(2 年+)→ resample_to_1d 给 gate 数百根日线。
# 此前误写 okx_swap_5m 导致 gate 去读 5m 表,BTC 只剩 58 根日线报 insufficient。
db_source: okx_swap
resample_to_1d: true
donchian:
  n_enter: 20
  n_exit: 20
indicators:
  adx:
    enabled: true
    period: 14
    entry: 20
    exit: 15
  atr:
    enabled: true
    chandelier_period: 22
    chandelier_mult: 3
    health_min: 0.005
    health_max: 0.1
signal_logic:
  min_confluence: 3
  direction: dual
risk:
  cost_bps: 10
  max_position_pct: 1
live:
  donchian_period: 20
  adx_period: 14
  adx_entry: 20
  adx_exit: 15
  chandelier_period: 22
  chandelier_mult: 3
  max_holding_days: 30
  qty_usd: 200
  risk_pct: 1.0
  max_qty_usd: 1000
  trade_enabled: true
  use_ema: true
  ema_period: 50
  # 关闭(2026-07-20):近 177 次日线评估的逐项通过率 —— 突破 2.8% / ADX≥20 76.8% /
  # ATR健康 100% / EMA 59.9% / MACD 仅 20.3% / 全部同时 1.7%。MACD(12,26,9) 在日线是
  # 滞后指标,要求它在突破 bar 已翻正 = 要求趋势已走过一段,与"突破入场"自相矛盾,
  # 把本就低频的策略压到全历史 2 次入场。保留 EMA50(过滤强度温和)。
  use_macd: false
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
mode: paper
status: ported-paper
gate:
  n_splits: 6
  embargo_bars: 50
