strategy: vwap_mr_dual
description: "1H SWAP VWAP mean reversion — VWAP z-score 均值回归（三标的组合，VALIDATED-ACCEPTED 2026-08）"
timeframe: 1H
instruments:
- BTC-USDT-SWAP
- ETH-USDT-SWAP
- SOL-USDT-SWAP
db_table: market_data.ohlcv_1h
db_source: okx_swap_5m
resample_bars: 12
indicators:
  vwap:
    enabled: true
    window: 7
    z_threshold: 2.02
signal_logic:
  direction: both
risk:
  cost_bps: 10.0
  hold_bars: 7
# live paper params (read by paper/node.py → VwapMR1H; edit via Configure tab)
live:
  # ── 2026-08-06 复活：Veya Loop × Helivex 组合回测 VALIDATED-ACCEPTED ──
  # 证据链（docs/integration/VWAP_MR_FUTURES_1H_OPTIMIZATION.md §4）：
  #   - 三标的等权组合 BO（3 seed × 30 次回测）：2/3 seed 过 test 门禁
  #     （test SR +0.467/+0.377 @ 80% 仓位），三标的 test ret 18/18 全正
  #   - 参数 ±10% 扰动 × 14：28/28 过 min_sharpe 0.3（0.5 与 0.8 仓位各一轮）
  #   - 保留项：train 段（2026-04→06）组合 SR 为负的区间效应 → 观察期复核
  trade_enabled: true
  # 优化参数（seed0 best @ 80% 仓位：vwap_n=6.56/std_n=43.75/z_thr=2.02/hold=7.18/
  # sl_std=1.63/min_rr=2.39/cooldown_after_sl=5.45，取整）
  vwap_n: 7
  std_n: 44
  z_thr: 2.02
  hold: 7
  sl_std: 1.63
  min_rr: 2.39
  cooldown_after_sl: 5
  # 80% 资金配置：max_qty_usd = 0.8 × BASE_EQUITY_USD(5000)；risk_pct 定仓在
  # 紧止损下会顶到该 cap（回测 position_fraction=0.8 的 paper 侧对应物）
  qty_usd: 4000
  risk_pct: 1.0
  max_qty_usd: 4000
mode: paper
gate:
  n_splits: 6
  embargo_bars: 50
  pbo_threshold: 0.5
