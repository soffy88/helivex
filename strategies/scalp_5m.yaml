strategy: scalp_5m
description: "5M SWAP VWAP-MR 剥头皮 (BTC/ETH/SOL) — NO-GO 观察对象"
timeframe: 5M
instruments:
  - BTC-USDT-SWAP
  - ETH-USDT-SWAP
  - SOL-USDT-SWAP

# ⚠ GATE: NO-GO — R5 成本碾死
# gross Sharpe +1.33 但 taker 成本 307%/yr
# 净回报: deeply negative OOS
# 运行目的: 测量真实 fill rate / 滑点 vs backtest 假设 (97% maker, 2bps)
gate_status: retired
gate_reason: "R5: taker 307%/yr 成本碾死, gross +1.33 net deeply negative. 2026-07-20 退役:
  1072 回合实测毛 P&L −$0.25(≈打平)+ 100% taker × 5bps/边 ⇒ 净值必负,R5 判决被生产数据确认."
gross_sharpe_backtest: 1.33
taker_cost_pct_yr: 307.0

indicators:
  vwap:
    enabled: true
    window: 12        # 12 × 5m = 1H rolling VWAP
    z_threshold: 2.0
signal_logic:
  entry: "abs(z) > z_thr  (2-sigma VWAP deviation)"
  exit:  "time_exit after 6 bars (30min)"
  min_confluence: 1
  direction_mode: dual
risk:
  cost_bps: 10.0    # backtest assumed; real taker likely higher
  hold_bars: 6
  qty_usd: 50       # intentionally small — known loser, limit paper burn
# live paper params (read by paper/node.py → Scalp5M; edit via Configure tab)
live:
  sl_std: 1.0
  min_rr: 1.5
  cooldown_after_sl: 0
  # 2026-07-20 撤销退役,转 maker 实验。依据:1135 回合逐回合配对,毛收益
  # +1.48bps/回合、95%CI [-0.80,+3.77]、t=1.27 —— 与零不可区分且点估计为正,
  # 是全系统唯一毛边际不为负的策略。压死它的是 10bps taker 成本,而 100% taker
  # 是 IOC 市价单的实现选择、不是策略性质。
  entry_enabled: true
  # post-only 挂单:入场/TP/时间平仓走 maker,止损永远吃单(挂单不成交=敞口无上限)。
  # 待测量:① 实际 maker 成交率(R5 假设 97%,从未实测)② 逆向选择有多贵 ——
  # 挂单只在市场走向你时成交,填单的那批天然更差,毛边际会低于 +1.48,低多少只能实测。
  # 费率算术(OKX 标准档 maker 2bps/taker 5bps):双腿 maker 4bps/回合 → 净 -2.5bps,
  # 点估计仍为负但落在 CI 内。本实验的产出是知识不是收益,别按盈利预期看。
  maker_mode: true
  maker_timeout_bars: 1
  # 实测 03:20 用滞后报价挂 BUY@76.81(市价已跌到 76.71),post-only 穿价被
  # OKX 450ms 内撤单。超过此龄不挂单、直接吃单。
  quote_max_age_ms: 2000
  vwap_n: 12
  z_thr: 2.0
  hold: 6
  qty_usd: 50
mode: paper
