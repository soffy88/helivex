  # 1.5× 入场初始风险距离即市价离场;通道出场仍是正常路径,硬止损只兜尾部
  hard_sl_mult: 1.5
mode: paper
gate:
  n_splits: 6
  embargo_bars: 50
  pbo_threshold: 0.5
