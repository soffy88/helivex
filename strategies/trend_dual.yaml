strategy: trend_dual
description: "4H SWAP trend following \u2014 SuperTrend+EMA+ADX+MACD confluence"
timeframe: 4H
instruments:
- BTC-USDT-SWAP
- ETH-USDT-SWAP
- SOL-USDT-SWAP
db_table: market_data.ohlcv_1h
db_source: okx_swap
resample_bars: 1
indicators:
  supertrend:
    enabled: true
    period: 10
    multiplier: 3.0
  ema:
    enabled: true
    fast: 20
    slow: 50
  adx:
    enabled: true
    period: 14
    threshold: 25.0
  macd:
    enabled: true
    fast: 12
    slow: 26
    signal: 9
signal_logic:
  min_confluence: 2
  direction: both
risk:
  cost_bps: 10.0
  bear_ma: 0
live:
  n_enter: 20
  n_exit: 10
  qty_usd: 200
  risk_pct: 1.0
  max_qty_usd: 1000
