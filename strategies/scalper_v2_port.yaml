strategy: scalper_v2_port
description: "helixa intraday_scalper_v2 移植 — 5m 双模式(ADX 滞回:RSI/BB 均值回归 ↔ BB 突破)+ ATR×1.5 移动止损 + 4h 时间止损(SWAP,多空)"
timeframe: 5M
instruments:
- BTC-USDT-SWAP
- ETH-USDT-SWAP
- SOL-USDT-SWAP
db_table: market_data.ohlcv_5m
db_source: okx_swap_5m
# 源自 helixa HELIXA V1.5 §6.6(intraday_scalper_v2/config.py)
indicators:
  bb:
    enabled: true
    period: 20
    k: 2.0
  rsi:
    enabled: true
    period: 14
    overbought: 70
    oversold: 30
  adx:
    enabled: true
    period: 14
    enter_breakout: 22
    exit_breakout: 18
    cooldown_bars: 4
  atr:
    enabled: true
    trailing_mult: 1.5
    breakout_exit_adx: 15
signal_logic:
  min_confluence: 2
  direction: dual
risk:
  cost_bps: 10.0
  max_position_pct: 1.0
# live paper params;trade_enabled=true → paper 交易(OKX demo);gate 仍 UNVALIDATED
live:
  bb_period: 20
  bb_k: 2.0
  rsi_period: 14
  adx_period: 14
  adx_enter_breakout: 22
  adx_exit_breakout: 18
  cooldown_bars: 4
  trailing_atr_mult: 1.5
  sl_atr_mult: 1.0
  min_rr: 1.5
  breakout_exit_adx: 15
  max_holding_bars: 48
  qty_usd: 50
  trade_enabled: true
  use_ema: true
  ema_period: 50
  use_macd: true
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
mode: paper
status: ported-paper
gate:
  n_splits: 6
  embargo_bars: 50
