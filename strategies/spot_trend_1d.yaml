strategy: spot_trend
description: "Daily Donchian spot trend \u2014 long-only, 200d SMA bear filter (SWAP\
  \ proxy)"
timeframe: 1D
instruments:
- BTC-USDT-SWAP
- ETH-USDT-SWAP
- SOL-USDT-SWAP
db_table: market_data.ohlcv_1h
# okx_swap = SWAP 4H bars(6.5 年)→ resample_to_1d;此前误指 5m 表致日线仅 98 根报数据不足
db_source: okx_swap
resample_to_1d: true
donchian:
  n_enter: 20
  n_exit: 10
risk:
  cost_bps: 10.0
  bear_ma: 200
  max_position_pct: 1.0
indicators:
  supertrend:
    enabled: false
  ema:
    enabled: false
  adx:
    enabled: false
  macd:
    enabled: false
signal_logic:
  min_confluence: 1
  direction: long
# live paper params (read by paper/node.py → SpotTrend1D; edit via Configure tab)
live:
  n_enter: 20
  n_exit: 10
  bear_ma: 200
  qty_usd: 200
  risk_pct: 1.0
  max_qty_usd: 1000
mode: paper
gate:
  n_splits: 6
  embargo_bars: 50
  pbo_threshold: 0.5
